# Reference ingress for zap-host.
# Replace the certificate paths and server_name with deployment-managed values.
# The backend must remain bound to 127.0.0.1 unless the deployment policy is
# explicitly redesigned and reviewed.

server {
    listen 443 ssl http2;
    server_name web.example.invalid;

    ssl_certificate     /etc/zap/tls/fullchain.pem;
    ssl_certificate_key /etc/zap/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    client_max_body_size 64k;
    client_body_timeout 10s;
    keepalive_timeout 15s;

    location / {
        limit_except GET POST { deny all; }
        # NOSONAR: the upstream is loopback-only; public traffic terminates TLS above.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }
}

server {
    listen 80;
    server_name web.example.invalid;
    return 308 https://$host$request_uri;
}
