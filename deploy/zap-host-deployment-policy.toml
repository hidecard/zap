# Reference policy for the zap-host adapter.
# This is not a credential store and is not sufficient by itself for deployment.
version = 1
service = "zap-host"
bind_address = "127.0.0.1:3000"
public_ingress = "tls-terminating-proxy-only"
http_redirect = true
allowed_methods = ["GET", "POST"]
max_request_bytes = 65536
request_timeout_seconds = 10
shutdown_drain_timeout_seconds = 30
upstream_timeout_seconds = 15
readiness_path = "/ready"
liveness_path = "/health"

[sandbox]
user = "zap-host"
dynamic_user = true
no_new_privileges = true
private_tmp = true
private_devices = true
protect_system = "strict"
protect_home = true
writable_paths = []

[quotas]
memory_bytes = 268435456
cpu_percent = 50
tasks = 128
open_files = 2048

[credentials]
source = "deployment-secret-manager"
file_mode = "0600"
required = []
redacted_from_logs = true
raw_credentials_enter_zap_contract = false

[egress]
backend_network = "deployment-specific-allowlist"
allowed_cidrs = ["127.0.0.0/8", "::1/128"]
external_egress = false

[rate_limit]
algorithm = "fixed-window"
requests = 60
window_seconds = 60
state = "shared-atomic-store-required-for-multiple-instances"
key = "verified-subject-tenant-route-class"

[supervision]
restart = "on-failure"
restart_seconds = 3
stop_timeout_seconds = 35
readiness_removed_before_termination = true

[production_gates]
demo_repository_allowed = false
demo_authenticator_allowed = false
local_rate_limit_store_allowed = false
runtime_cli_subprocess_per_request_allowed = false
