# Reference nginx ingress policy for the Zap registry service.
# Install with a real certificate/key managed by the deployment platform.
server {
    listen 443 ssl http2;
    server_name registry.example.invalid;

    ssl_certificate     /etc/zap/tls/fullchain.pem;
    ssl_certificate_key /etc/zap/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    client_max_body_size 1m;
    client_body_timeout 10s;
    keepalive_timeout 15s;

    # Health probes are intended for local systemd/monitoring checks only.
    # If an external load balancer must probe them, allow only its fixed CIDR
    # instead of exposing these endpoints publicly.
    location = /healthz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8787/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location = /readyz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8787/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location / {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }
}

server {
    listen 80;
    server_name registry.example.invalid;
    return 308 https://$host$request_uri;
}
