name: Notify Zap Documentation Site

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "website/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger documentation-site rebuild
        env:
          GH_TOKEN: ${{ secrets.ZAP_DOCS_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::notice::ZAP_DOCS_DISPATCH_TOKEN is not configured; skipping external documentation rebuild notification."
            exit 0
          fi

          gh api repos/hidecard/zap-docu/dispatches \
            --method POST \
            --field event_type=zap-docs-updated \
            --field client_payload[source_sha]="$SOURCE_SHA" \
            --field client_payload[source_ref]=master
