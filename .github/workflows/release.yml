name: Zap Native Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: zap-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Test and validate release source
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Check formatting
        run: cargo fmt --manifest-path native/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path native/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Cargo check
        run: cargo check --manifest-path native/Cargo.toml --all-targets --all-features

      - name: Run native unit and integration tests
        run: cargo test --manifest-path native/Cargo.toml --all-targets --all-features

      - name: Check repository whitespace
        run: git diff --check

      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = \"\(.*\)\"$/\1/p' native/Cargo.toml | head -n 1)"
          test "$tag_version" = "$cargo_version" || {
            echo "Tag version $tag_version does not match Cargo version $cargo_version"
            exit 1
          }

  build:
    name: Build ${{ matrix.name }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_suffix: linux-x86_64.tar.gz
            binary: zap
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            archive_suffix: macos-arm64.tar.gz
            binary: zap
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_suffix: windows-x86_64.zip
            binary: zap.exe

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build native binary
        run: cargo build --release --manifest-path native/Cargo.toml --target ${{ matrix.target }}

      - name: Run target-native tests
        run: cargo test --manifest-path native/Cargo.toml --target ${{ matrix.target }} --all-targets --all-features

      - name: Smoke-test Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          zap="native/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          test -x "$zap"
          "$zap" --version
          "$zap" --help >/dev/null
          "$zap" examples/default_parameters.zp >/tmp/zap-example.out
          grep -q "Hello, World!" /tmp/zap-example.out
          "$zap" scripts/p3_smoke.zp

      - name: Smoke-test Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zap = "native/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if (-not (Test-Path $zap)) { throw "Binary was not produced: $zap" }
          & $zap --version
          & $zap --help | Out-Null
          & $zap examples/default_parameters.zp | Select-String "Hello, World!" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Example smoke test failed" }
          $smoke = Get-Content scripts/p3_smoke.zp -Raw
          $smoke = $smoke -replace 'process_run\("printf", \["zap"\]\)', 'process_run("cmd", ["/C", "echo", "zap"])'
          $smoke = $smoke -replace 'result\["stdout"\] == "zap"', 'contains(result["stdout"], "zap")'
          Set-Content -Path p3_smoke.zp -Value $smoke -Encoding utf8
          & $zap p3_smoke.zp
          if ($LASTEXITCODE -ne 0) { throw "P3.3 smoke test failed" }

      - name: Set versioned archive name
        if: runner.os != 'Windows'
        shell: bash
        run: echo "ARCHIVE=zap-${GITHUB_REF_NAME#v}-${{ matrix.archive_suffix }}" >> "$GITHUB_ENV"

      - name: Set versioned archive name
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          "ARCHIVE=zap-$version-${{ matrix.archive_suffix }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package Unix release
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package/zap/bin package/zap/docs package/zap/examples
          cp "native/target/${{ matrix.target }}/release/${{ matrix.binary }}" package/zap/bin/
          cp README.md CHANGELOG.md CHANGELOG_EN.md CHANGELOG_MM.md install.sh uninstall.sh package/zap/
          cp docs/USAGE.md docs/LANGUAGE_GUIDE.md docs/SYNTAX_GUIDE_EN.md package/zap/docs/
          cp examples/default_parameters.zp examples/hello.zp package/zap/examples/
          printf 'Zap release artifact\nVersion: %s\nTarget: %s\n' "${GITHUB_REF_NAME#v}" "${{ matrix.target }}" > package/zap/RELEASE.txt
          chmod 0755 package/zap/bin/${{ matrix.binary }}
          export SOURCE_DATE_EPOCH=0
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - -C package zap | gzip -n > "$ARCHIVE"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force package -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force package/zap/bin, package/zap/docs, package/zap/examples | Out-Null
          Copy-Item "native/target/${{ matrix.target }}/release/${{ matrix.binary }}" package/zap/bin/
          Copy-Item README.md, CHANGELOG.md, CHANGELOG_EN.md, CHANGELOG_MM.md, install_windows.bat, uninstall_windows.bat package/zap/
          Copy-Item docs/USAGE.md, docs/LANGUAGE_GUIDE.md, docs/SYNTAX_GUIDE_EN.md package/zap/docs/
          Copy-Item examples/default_parameters.zp, examples/hello.zp package/zap/examples/
          "Zap release artifact`nVersion: $($env:GITHUB_REF_NAME -replace '^v','')`nTarget: ${{ matrix.target }}" | Out-File -Encoding utf8 package/zap/RELEASE.txt
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function New-DeterministicZip([string]$sourceRoot, [string]$destination) {
            if (Test-Path $destination) { Remove-Item -Force $destination }
            $stream = [System.IO.File]::Open($destination, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
            try {
              $zip = New-Object System.IO.Compression.ZipArchive($stream, [System.IO.Compression.ZipArchiveMode]::Create, $false)
              try {
                $root = (Resolve-Path $sourceRoot).Path.TrimEnd([char]92, [char]47)
                $files = Get-ChildItem -LiteralPath $root -File -Recurse | Sort-Object FullName
                foreach ($file in $files) {
                  $relative = $file.FullName.Substring($root.Length).TrimStart([char]92, [char]47) -replace '\\', '/'
                  $entry = $zip.CreateEntry($relative, [System.IO.Compression.CompressionLevel]::Optimal)
                  $entry.LastWriteTime = [DateTimeOffset]::FromUnixTimeSeconds(0)
                  $input = [System.IO.File]::OpenRead($file.FullName)
                  try {
                    $output = $entry.Open()
                    try { $input.CopyTo($output) } finally { $output.Dispose() }
                  } finally { $input.Dispose() }
                }
              } finally { $zip.Dispose() }
            } finally { $stream.Dispose() }
          }
          New-DeterministicZip 'package/zap' "$env:ARCHIVE"
          $hash = (Get-FileHash "$env:ARCHIVE" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ARCHIVE" | Out-File -Encoding ascii "$env:ARCHIVE.sha256"

      - name: Verify packaged archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$ARCHIVE.sha256"
          export SOURCE_DATE_EPOCH=0
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - -C package zap | gzip -n > "$ARCHIVE.repro"
          cmp -s "$ARCHIVE" "$ARCHIVE.repro" || { echo "Archive is not reproducible"; exit 1; }
          rm -f "$ARCHIVE.repro"
          tar -tzf "$ARCHIVE" | grep -E 'zap/bin/zap|zap/README.md|zap/RELEASE.txt|zap/docs/SYNTAX_GUIDE_EN.md|zap/examples/hello.zp'
          tar -xOf "$ARCHIVE" zap/RELEASE.txt | grep -F "Version: ${GITHUB_REF_NAME#v}"

      - name: Verify packaged archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $line = Get-Content "$env:ARCHIVE.sha256"
          $expected = ($line -split '\s+')[0]
          $actual = (Get-FileHash "$env:ARCHIVE" -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "Archive checksum mismatch" }
          if (-not (Test-Path "$env:ARCHIVE")) { throw "Archive was not produced" }
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function New-DeterministicZip([string]$sourceRoot, [string]$destination) {
            if (Test-Path $destination) { Remove-Item -Force $destination }
            $stream = [System.IO.File]::Open($destination, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
            try {
              $zip = New-Object System.IO.Compression.ZipArchive($stream, [System.IO.Compression.ZipArchiveMode]::Create, $false)
              try {
                $root = (Resolve-Path $sourceRoot).Path.TrimEnd([char]92, [char]47)
                $files = Get-ChildItem -LiteralPath $root -File -Recurse | Sort-Object FullName
                foreach ($file in $files) {
                  $relative = $file.FullName.Substring($root.Length).TrimStart([char]92, [char]47) -replace '\\', '/'
                  $entry = $zip.CreateEntry($relative, [System.IO.Compression.CompressionLevel]::Optimal)
                  $entry.LastWriteTime = [DateTimeOffset]::FromUnixTimeSeconds(0)
                  $input = [System.IO.File]::OpenRead($file.FullName)
                  try {
                    $output = $entry.Open()
                    try { $input.CopyTo($output) } finally { $output.Dispose() }
                  } finally { $input.Dispose() }
                }
              } finally { $zip.Dispose() }
            } finally { $stream.Dispose() }
          }
          New-DeterministicZip 'package/zap' "$env:ARCHIVE.repro"
          $reproHash = (Get-FileHash "$env:ARCHIVE.repro" -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $reproHash) { throw "Windows archive is not reproducible" }
          Remove-Item -Force "$env:ARCHIVE.repro"
          $entries = (tar -tf "$env:ARCHIVE")
          foreach ($required in @('bin/zap.exe', 'README.md', 'RELEASE.txt', 'docs/SYNTAX_GUIDE_EN.md', 'examples/hello.zp')) {
            if ($entries -notcontains "zap/$required") { throw "Missing archive entry: zap/$required" }
          }
          $releaseText = (tar -xOf "$env:ARCHIVE" zap/RELEASE.txt | Out-String)
          $releaseVersion = $env:GITHUB_REF_NAME -replace '^v',''
          if ($releaseText -notmatch "Version: $releaseVersion") { throw "Release version metadata mismatch" }

      - name: Verify Unix installer in a clean home
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/verify_installer_unix.sh "$ARCHIVE" "${GITHUB_REF_NAME#v}"

      - name: Verify Windows installer in a clean profile
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify_installer_windows.ps1 -Archive "$env:ARCHIVE" -ExpectedVersion ($env:GITHUB_REF_NAME -replace '^v','')

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            zap-*.tar.gz
            zap-*.zip
            zap-*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify all downloaded checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          for checksum in *.sha256; do sha256sum -c "$checksum"; done

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
