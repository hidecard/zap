name: Zap CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Rust quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75.0
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Validate release version consistency
        env:
          ZAP_VERSION_REPORT: target/version-consistency.tsv
        run: scripts/validate_release_version.sh

      - name: Upload version consistency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-version-consistency-${{ github.sha }}
          path: target/version-consistency.tsv
          if-no-files-found: error

      - name: Run version consistency regression
        run: scripts/test_validate_release_version.sh

      - name: Validate documentation consistency
        env:
          ZAP_DOCS_REPORT: target/documentation-consistency.tsv
        run: scripts/validate_documentation_consistency.sh

      - name: Upload documentation consistency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-documentation-consistency-${{ github.sha }}
          path: target/documentation-consistency.tsv
          if-no-files-found: error

      - name: Run documentation consistency regression
        run: scripts/test_validate_documentation_consistency.sh

      - name: Check formatting
        run: cargo fmt --manifest-path native/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path native/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Cargo check
        run: cargo check --manifest-path native/Cargo.toml --all-targets --all-features

      - name: Run integration tests
        run: cargo test --manifest-path native/Cargo.toml --all-targets --all-features

      - name: Run type-check conformance TC-001 through TC-005
        run: cargo test --manifest-path native/Cargo.toml --test core typecheck_p0_conformance_matrix_tc001_to_tc005 --all-features -- --exact --nocapture

      - name: Run type-check conformance TC-006 through TC-008
        run: cargo test --manifest-path native/Cargo.toml --test core typecheck_p1_conformance_tc006_to_tc008 --all-features -- --exact --nocapture

      - name: Run type-check conformance TC-009 and TC-010
        run: |
          cargo test --manifest-path native/Cargo.toml --test core typecheck_p1_conformance_tc009_conditional_expression --all-features -- --exact --nocapture
          cargo test --manifest-path native/Cargo.toml --test core typecheck_p1_conformance_tc010_alias_wrapper_narrowing --all-features -- --exact --nocapture

      - name: Run CLI/LSP diagnostic parity regression
        run: cargo test --manifest-path native/Cargo.toml --bin zap lsp_diagnostics_match_cli_type_error_contract --all-features -- --nocapture

      - name: Run security property corpus
        run: cargo test --manifest-path native/Cargo.toml security_property --all-features

      - name: Run dependency-free benchmark regression gate
        env:
          ZAP_BENCH_REPEATS: 5
          ZAP_BENCH_WARMUPS: 1
          ZAP_BENCH_OUTPUT: benchmark-results/native.csv
          ZAP_BENCH_MAX_REGRESSION_PERCENT: 200
        run: |
          set -o pipefail
          cargo build --manifest-path native/Cargo.toml --release --locked
          scripts/benchmark_native.sh
          scripts/aggregate_benchmark.sh benchmark-results/native.csv benchmark-results/native-summary-current.csv
          test "$(awk 'END { print NR - 1 }' benchmark-results/native-summary-current.csv)" -eq 7
          scripts/check_benchmark_regression.sh benchmark-results/native-summary.csv benchmark-results/native-summary-current.csv "$ZAP_BENCH_MAX_REGRESSION_PERCENT" 2>&1 | tee benchmark-results/regression.txt

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: zap-benchmark-${{ github.sha }}
          path: benchmark-results/*
          if-no-files-found: error

      - name: Run filesystem confinement corpus
        run: cargo test --manifest-path native/Cargo.toml filesystem_builtins --all-features

      - name: Run standard-library security corpus
        run: cargo test --manifest-path native/Cargo.toml stdlib_security_corpus --all-features

      - name: Run threaded async I/O and scheduler tests
        run: "cargo test --manifest-path native/Cargo.toml async_runtime --all-features"

      - name: Run socket and process adapter tests
        run: |
          cargo test --manifest-path native/Cargo.toml nonblocking_tcp_exchange --all-features
          cargo test --manifest-path native/Cargo.toml async_process_adapter --all-features

      - name: Run forced process cancellation tests
        run: "cargo test --manifest-path native/Cargo.toml forced_cancellation --all-features"

      - name: Run authenticated registry service tests
        run: "cargo test --manifest-path native/Cargo.toml registry_service --all-features"

      - name: Run parser JSON lockfile corpus
        run: |
          cargo test --manifest-path native/Cargo.toml adversarial_corpus --all-features
          cargo test --manifest-path native/Cargo.toml malformed_program_corpus --all-features
          cargo test --manifest-path native/Cargo.toml json_security_corpus --all-features
          cargo test --manifest-path native/Cargo.toml malformed_lockfile_corpus --all-features
          cargo test --manifest-path native/Cargo.toml lockfile_quoted_values --all-features

      - name: Run P1-05 deterministic and replayable layer validation
        env:
          ZAP_CORPUS_SEED: 20260821
          ZAP_CORPUS_REPLAY_LOG: target/p105-replay.log
        run: scripts/test_p105_layers.sh

      - name: Upload P1-05 replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-p105-replay-${{ github.sha }}
          path: target/p105-replay.log
          if-no-files-found: error

      - name: Run M2-VERIFY-01 bounded replay job
        env:
          ZAP_CORPUS_SEED: 20260821
          ZAP_CORPUS_ROUNDS: 12
          ZAP_BOUNDED_REPLAY_REPORT: target/m2-verify-replay.tsv
          ZAP_BOUNDED_REPLAY_LOG: target/m2-verify-replay.log
        run: scripts/test_m2_verify_replay.sh

      - name: Run M2-VERIFY-01 contract regression
        run: scripts/test_m2_verify_replay_contract.sh

      - name: Upload M2-VERIFY-01 replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-m2-verify-replay-${{ github.sha }}
          path: |
            target/m2-verify-replay.tsv
            target/m2-verify-replay.log
          if-no-files-found: error

      - name: Run P0-01 native/legacy parity matrix
        env:
          ZAP_PARITY_REPORT: target/p001-parity-report.tsv
        run: scripts/test_p001_parity.sh

      - name: Upload P0-01 parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-p001-parity-${{ github.sha }}
          path: target/p001-parity-report.tsv
          if-no-files-found: error

      - name: Validate P0-02 specification ownership index
        env:
          ZAP_SPEC_OWNERSHIP_REPORT: target/spec-ownership-report.tsv
        run: scripts/validate_spec_ownership.sh

      - name: Upload P0-02 ownership evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-p002-ownership-${{ github.sha }}
          path: target/spec-ownership-report.tsv
          if-no-files-found: error

      - name: Validate registry deployment policy
        run: scripts/validate_registry_deployment.sh

      - name: Check repository whitespace
        run: git diff --check

  build:
    name: Build ${{ matrix.name }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: ${{ matrix.target }}

      - name: Build native runtime
        run: cargo build --release --manifest-path native/Cargo.toml --target ${{ matrix.target }}

      - name: Run target-native tests
        run: cargo test --manifest-path native/Cargo.toml --target ${{ matrix.target }} --all-targets --all-features

      - name: Run focused async matrix
        shell: bash
        env:
          ZAP_ASYNC_TARGET: ${{ matrix.target }}
          ZAP_ASYNC_LOG: target/p005c-async-${{ matrix.target }}.log
        run: scripts/test_p005c_async_matrix.sh

      - name: Upload async matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p005c-async-${{ matrix.target }}
          path: target/p005c-async-${{ matrix.target }}.log
          if-no-files-found: error

      - name: Verify Linux/macOS binary
        if: runner.os != 'Windows'
        run: test -x native/target/${{ matrix.target }}/release/zap

      - name: Verify Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Test-Path "native/target/${{ matrix.target }}/release/zap.exe")) { throw "zap.exe was not produced" }

      - name: Run Linux/macOS CLI smoke checks
        if: runner.os != 'Windows'
        shell: bash
        run: |
          zap="native/target/${{ matrix.target }}/release/zap"
          "$zap" --version
          "$zap" --help >/dev/null
          "$zap" examples/default_parameters.zp
          "$zap" scripts/p3_smoke.zp

      - name: Run Windows CLI smoke checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zap = "native/target/${{ matrix.target }}/release/zap.exe"
          & $zap --version
          & $zap --help | Out-Null
          & $zap examples/default_parameters.zp
          @'
          let parsed = url_parse("https://example.com:8443/api?q=zap")
          assert(parsed["scheme"] == "https", "URL scheme mismatch")
          assert(parsed["port"] == some(8443), "URL port mismatch")
          let setting = env_get("ZAP_CI_MISSING_SETTING", "fallback")
          assert(setting == "fallback", "environment default mismatch")
          let root = config_dir()
          let safe = config_path("zap-ci-smoke.conf")
          assert(type(root) == "text", "configuration directory must be text")
          assert(type(safe) == "text", "configuration path must be text")
          let result = process_run("cmd", ["/C", "echo", "zap"])
          assert(result["success"] == true, "process smoke failed")
          assert(trim(result["stdout"]) == "zap", "process output mismatch")
          '@ | Set-Content -Encoding utf8 p3_smoke.zp
          & $zap p3_smoke.zp
          if ($LASTEXITCODE -ne 0) { throw "P3.3 smoke test failed" }
