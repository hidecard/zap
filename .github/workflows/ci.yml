name: Zap CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Rust quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Check formatting
        run: cargo fmt --manifest-path native/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path native/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Cargo check
        run: cargo check --manifest-path native/Cargo.toml --all-targets --all-features

      - name: Run integration tests
        run: cargo test --manifest-path native/Cargo.toml --all-targets --all-features

      - name: Check repository whitespace
        run: git diff --check

  build:
    name: Build ${{ matrix.name }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: ${{ matrix.target }}

      - name: Build native runtime
        run: cargo build --release --manifest-path native/Cargo.toml --target ${{ matrix.target }}

      - name: Verify Linux/macOS binary
        if: runner.os != 'Windows'
        run: test -x native/target/${{ matrix.target }}/release/zap

      - name: Verify Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Test-Path "native/target/${{ matrix.target }}/release/zap.exe")) { throw "zap.exe was not produced" }

      - name: Run Linux/macOS CLI smoke checks
        if: runner.os != 'Windows'
        shell: bash
        run: |
          native/target/${{ matrix.target }}/release/zap --version
          native/target/${{ matrix.target }}/release/zap --help >/dev/null
          native/target/${{ matrix.target }}/release/zap examples/default_parameters.zp

      - name: Run Windows CLI smoke checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zap = "native/target/${{ matrix.target }}/release/zap.exe"
          & $zap --version
          & $zap --help | Out-Null
          & $zap examples/default_parameters.zp
