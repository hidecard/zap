name: Deploy Zap Documentation Site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish documentation site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish website to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./website
          force_orphan: true
          keep_files: false
          commit_message: "deploy: publish Zap documentation site"

      - name: Print expected Pages URL
        run: 'echo "Documentation site: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"'

# GitHub Settings > Pages must use:
# Source: Deploy from a branch
# Branch: gh-pages / root
# This branch-based deployment does not require the Pages API enablement permission.

# The site includes English and Burmese documentation links plus the live CI badge.
