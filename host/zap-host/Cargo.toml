[package]
name = "zap-host"
version = "0.1.0"
edition = "2021"
description = "Axum and Tower host adapter for Zap Web contracts"
license = "MIT"

[dependencies]
async-trait = "0.1"
axum = { version = "0.7.9", default-features = false, features = ["http1", "json", "tokio"] }
jsonwebtoken = { version = "9.3.1", default-features = false }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5.2", default-features = false, features = ["limit", "sensitive-headers", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
