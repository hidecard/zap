# Canonical Zap bootstrap version contract.
# These values are intentionally independent: a language change does not imply
# an artifact-schema change, and a bootstrap-stage change does not imply either.

language_version = "2.10.1"
compiler_version = "2.10.1"
stdlib_version = "2.10.1"

[token_schema]
version = 1

[ast_schema]
version = 1

[diagnostic_schema]
version = 1

[typed_ir_schema]
version = 1

[manifest_schema]
version = 1

[lockfile_schema]
version = 1

[bootstrap]
stage = "B0"
reference_owner = "native Rust implementation"
self_hosted = false
# The overall bootstrap remains B0 while the B1 lexer milestone is independently reached.
lexer_stage = "B1"
lexer_owner = "bootstrap/b1/lexer.zp"

[platform_seed]
version = "0"
status = "documented-boundary-only"
