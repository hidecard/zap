schema_version = 1
contract_id = "ZAP-COMPILER-DRIVER"
status = "candidate"

[commands]
check = "parse-and-typecheck-without-emitting"
build = "source-to-deterministic-bytecode"
run = "build-then-zap-vm-execute"
test = "discover-and-run-zap-tests"

[pipeline]
stages = ["source", "typed_ir", "bytecode", "execution"]
owner = "bootstrap/b4/compiler_driver.zp"
seed = "bootstrap/b4/compiler_driver.zp"

[artifact]
schema_version = 1
encoding = "utf8-json"
newline = "LF"
key_order = "contract-order"
path_policy = "repository-relative-posix"
forbidden_fields = ["timestamp", "hostname", "username", "absolute_path", "temp_path", "pointer_address"]

[determinism]
source_normalization = "LF-UTF8-BOM-stripped"
module_order = "bytewise-lexical"
dependency_order = "canonical-topological"
map_order = "sorted-keys"
seed_epoch = 0

[acceptance]
source = "bootstrap/fixtures/driver/driver_smoke.zp"
module_graph_sources = ["bootstrap/fixtures/driver/module_graph_base.zp", "bootstrap/fixtures/driver/module_graph_app.zp"]
verifier = "scripts/bootstrap/verify_compiler_driver_contract.sh"
required_exports = ["driver_parse_source", "driver_typecheck_source", "driver_normalize_module_name", "driver_module_name_matches", "driver_module_match_count", "driver_module_index", "driver_order_module", "driver_order_modules", "driver_module_graph_manifest", "driver_collect_imports", "driver_resolve_modules", "driver_modules_graph_replay", "driver_source_index", "driver_check_modules", "driver_build_modules", "driver_module_build_manifest", "driver_modules_rebuild", "driver_typed_ir_semantics", "driver_typed_ir_ownership", "driver_promote_typed_ir", "driver_compile_backend", "driver_execute_owned_pipeline", "driver_check_source", "driver_build_source", "driver_run_source", "driver_test_source", "driver_command", "driver_build_package", "driver_artifact_record", "driver_canonical_artifacts", "driver_artifact_manifest", "driver_rebuild", "driver_subset_run", "driver_subset_rebuild"]
