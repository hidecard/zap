schema_version = 1
contract_id = "B4-RUST-FREE-FULL-LANGUAGE"
status = "not-certified"

# Candidate evidence passes on Windows x86_64 with the current native binary
# as the verified ZAP_BOOTSTRAP_BIN seed. The driver contract is `owned`,
# typed-IR semantics no longer require `candidate_only`, and 20/20 B4
# acceptance rows pass on the reference platform. Full certification requires
# reproduction of the same evidence on Linux x86_64, macOS ARM64, and
# Windows x86_64 clean environments with platform-native seeds.
full_language_surface = true
rust_or_cargo_in_compiler_path = false
user_facing_cli_owned_by_zap = true
build_path_owned_by_zap = true
test_path_owned_by_zap = true

[forbidden_fallbacks]
compiler_path = ["cargo", "rustc", "rustup", "native/src", "host/zap-host"]

[required_evidence]
source_to_ast = "bootstrap/fixtures/b4/full_language_surface.zp"
source_to_typed_ir = "bootstrap/fixtures/b4/full_language_surface.zp"
source_to_vm = "bootstrap/fixtures/b4/full_language_surface.zp"
cli_entrypoint = "bootstrap/b4/compiler_driver.zp"
driver_owned_pipeline = "scripts/bootstrap/verify_b4_driver_owned_pipeline.sh"
driver_source_to_vm = "scripts/bootstrap/verify_b4_driver_source_to_vm.sh"
seed_preflight = "scripts/bootstrap/verify_b4_seed_preflight.sh"
package_build = "bootstrap/b3/package.zp"
test_runner = "bootstrap/b4/runner.zp"
rebuild_manifest = "bootstrap/contracts/B4_ACCEPTANCE.tsv"
