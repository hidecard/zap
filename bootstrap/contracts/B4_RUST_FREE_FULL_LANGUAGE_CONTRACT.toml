schema_version = 2
contract_id = "B4-RUST-FREE-FULL-LANGUAGE"
status = "not-certified"

# Certification is deliberately separate from contract integrity. The repository
# must not claim B4 until every acceptance row passes on every supported target.
full_language_surface = true
rust_or_cargo_in_compiler_path = false
user_facing_cli_owned_by_zap = true
build_path_owned_by_zap = true
test_path_owned_by_zap = true

[forbidden_fallbacks]
compiler_path = ["cargo", "rustc", "rustup", "native/src", "host/zap-host"]

[acceptable_seed_provenance]
# A "Zap-produced seed" is defined as a binary produced through a compilation
# pipeline where the compiler logic is entirely owned by Zap source code, even
# if platform primitives (like system C compilers) are used for code generation.
# 
# The following provenance mechanisms are acceptable:
# 1. Python seed compiler (host/zap-bootstrap/compile.py) + C backend (host/zap-bootstrap/c_backend.py)
#    - Python is used as a reference implementation for the seed compiler
#    - C backend emits native code compiled by system C compiler (gcc/clang)
#    - The compiler logic (lexer, parser, typechecker, lowering) is in Zap source
# 2. Zap-written compiler (bootstrap/b1/b2/b3/b4/) + C backend
#    - Full compiler pipeline written in Zap
#    - C backend for native code generation
#    - System C compiler as platform primitive

# Platform primitives that are NOT considered Rust fallbacks:
# - python3 (seed compiler reference implementation)
# - gcc/clang (system C compiler for code generation)
# - make (build orchestration)

[required_evidence]
source_to_ast = "bootstrap/fixtures/b4/full_language_surface.zp"
source_to_typed_ir = "bootstrap/fixtures/b4/full_language_surface.zp"
source_to_vm = "bootstrap/fixtures/b4/full_language_surface.zp"
cli_entrypoint = "bootstrap/b4/compiler_driver.zp"
package_build = "bootstrap/b3/package.zp"
test_runner = "bootstrap/b4/runner.zp"
rebuild_manifest = "bootstrap/contracts/B4_ACCEPTANCE.tsv"
seed_provenance = "host/zap-bootstrap/c_backend.py"

[seed_metadata_requirements]
# Each generated seed must include a SEED.tsv metadata file with these fields:
commit = "git commit SHA used for seed generation"
platform = "target triple (e.g., x86_64-unknown-linux-gnu)"
artifact = "binary filename (e.g., zap or zap.exe)"
built_with = "toolchain used (e.g., python3-c-backend, cargo-rust, zap-owned)"
rust_free_provenance = "boolean indicating no Rust/Cargo in compilation chain"
certification_ready = "boolean indicating seed meets B4 certification requirements"
status = "seed status (e.g., ci-built-native-seed, zap-produced-seed)"
bytecode_digest = "SHA-256 of intermediate bytecode (if applicable)"
c_source_digest = "SHA-256 of generated C source (if applicable)"
native_digest = "SHA-256 of final native binary"
timestamp = "ISO 8601 timestamp of seed generation"
