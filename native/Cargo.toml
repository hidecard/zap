[package]
name = "zap-native"
version = "2.2.4"
edition = "2021"
description = "Standalone native runtime for Zap"

[[bin]]
name = "zap"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
ureq = { version = "=2.9.7", default-features = false, features = ["tls"] }

[dev-dependencies]
rcgen = "=0.12.1"
rustls = "=0.22.4"
time = "=0.3.30"
