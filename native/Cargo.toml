[package]
name = "zap-native"
version = "2.5.0"
edition = "2021"
description = "Standalone native runtime for Zap"

[[bin]]
name = "zap"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }

[dev-dependencies]
rcgen = "=0.13.2"
rustls = { version = "=0.23.40", default-features = false, features = ["ring"] }
time = "=0.3.47"
