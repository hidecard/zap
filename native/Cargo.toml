[package]
name = "zap-native"
version = "2.2.6"
edition = "2021"
description = "Standalone native runtime for Zap"

[[bin]]
name = "zap"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }

[dev-dependencies]
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
